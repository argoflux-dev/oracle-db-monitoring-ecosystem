---
- name: "BOOTSTRAP: Первичная настройка ОС и создание сервисного пользователя"
  hosts: vps
  become: true
  vars:
    ansible_user: oleg
    ansible_ssh_private_key_file: "~/.ssh/MadMax2Quasar_ed"

  tasks:
    - name: "1. ТОТАЛЬНАЯ ЗАЧИСТКА: Удаление старых ошибочных репозиториев"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker-ce.list
        - /etc/apt/sources.list.d/docker.sources
        - /etc/apt/sources.list.d/docker-official.list
        - /etc/apt/keyrings/docker.gpg
        - /etc/apt/trusted.gpg.d/docker.gpg

    - name: "2. Установка базовых системных утилит"
      apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release, git]
        state: present
        update_cache: yes

    - name: "3. Создание директории для ключей"
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: "4. Скачивание официального ключа Docker"
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /tmp/docker.gpg
        mode: '0644'

    - name: "5. Конвертация ключа в формат GPG"
      shell: |
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg < /tmp/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: "6. Удаление временного файла ключа"
      file:
        path: /tmp/docker.gpg
        state: absent

    - name: "7. Добавление официального репозитория Docker"
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker-official
        update_cache: yes

    - name: "8. Установка пакетов Docker и Docker Compose"
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: "9. Проверка запуска и включение службы Docker"
      service:
        name: docker
        state: started
        enabled: yes

    - name: "10. Создание изолированной группы ansible"
      group:
        name: ansible
        state: present

    - name: "11. Создание сервисного пользователя ansible и добавление в группу docker"
      user:
        name: ansible
        groups: docker
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    - name: "12. Добавление вашего SSH-ключа для пользователя ansible"
      authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '~/.ssh/MadMax2Quasar_ed.pub') }}"

    - name: "13. ЛИКВИДАЦИЯ: Отзыв беспарольных прав sudo у пользователя oleg"
      file:
        path: /etc/sudoers.d/oleg
        state: absent