---
- name: Развертывание инфраструктуры мониторинга и Vault на VPS
  hosts: vps
  become: true
  tasks:

    - name: Обновление кэша пакетов (apt)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установка системных зависимостей
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Добавление GPG-ключа Docker
      apt_key:
        url: https://docker.com
        state: present

    - name: Добавление репозитория Docker
      apt_repository:
        repo: "deb [arch=amd64] https://docker.com {{ ansible_distribution_release }} stable"
        state: present

    - name: Установка Docker и Docker Compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Проверка запуска Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Создание целевой директории проекта на VPS
      file:
        path: /opt/oracle-db-monitoring-ecosystem
        state: directory
        mode: '0755'

    - name: Копирование конфигурации телеметрии на VPS
      copy:
        src: ../infra-telemetry/
        dest: /opt/oracle-db-monitoring-ecosystem/infra-telemetry/
        mode: '0644'

    - name: Запуск контейнеров через Docker Compose
      command:
        cmd: docker compose up -d
        chdir: /opt/oracle-db-monitoring-ecosystem/infra-telemetry/

    - name: Ожидание запуска Vault API
      wait_for:
        port: 8200
        delay: 3
        timeout: 30

    - name: Создание секретов для Oracle DB в Vault
      uri:
        url: "http://localhost:8200/v1/secret/data/oracle"
        method: POST
        headers:
          X-Vault-Token: "my-super-secret-token"
          Content-Type: "application/json"
        body_format: json
        body:
          data:
            username: "monitoring_user"
            password: "db_password_123"
            dsn: "oracle-db-host:1521/ORCL"
        status_code: [200, 204]
